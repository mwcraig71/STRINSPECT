openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Bridge inspection session operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all inspection sessions
      description: Returns metadata for all synced sessions (no defect/NBI payload)
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"

    post:
      operationId: upsertSession
      tags: [sessions]
      summary: Upsert an inspection session
      description: Creates or replaces the session for a given structure number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSessionBody"
      responses:
        "200":
          description: Session saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a single session with full data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full session data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SessionSource:
      type: string
      enum: [mobile_sync, pdf_import]

    SessionStatus:
      type: string
      enum: [in_progress, finalized]

    SessionSummary:
      type: object
      properties:
        id:
          type: string
        structureNumber:
          type: string
        source:
          $ref: "#/components/schemas/SessionSource"
        status:
          $ref: "#/components/schemas/SessionStatus"
        finalizedAt:
          type: string
          format: date-time
          nullable: true
        teamLeader:
          type: ["string", "null"]
        teamMembers:
          type: array
          items:
            type: string
        inspectionDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        weather:
          type: ["string", "null"]
        equipmentUsed:
          type: ["string", "null"]
        defectCount:
          type: integer
        cs4Count:
          type: integer
        syncedAt:
          type: string
          format: date-time
      required:
        - id
        - structureNumber
        - source
        - status
        - teamMembers
        - defectCount
        - cs4Count
        - syncedAt

    SessionDetail:
      type: object
      properties:
        id:
          type: string
        structureNumber:
          type: string
        source:
          $ref: "#/components/schemas/SessionSource"
        status:
          $ref: "#/components/schemas/SessionStatus"
        finalizedAt:
          type: string
          format: date-time
          nullable: true
        teamLeader:
          type: ["string", "null"]
        teamMembers:
          type: array
          items:
            type: string
        inspectionDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        weather:
          type: ["string", "null"]
        equipmentUsed:
          type: ["string", "null"]
        defectCount:
          type: integer
        cs4Count:
          type: integer
        syncedAt:
          type: string
          format: date-time
        defects:
          type: array
          items: {}
        nbiRatings:
          type: array
          items: {}
        importSummary:
          nullable: true
        pdfAnnotations:
          type: array
          items: {}
          nullable: true
      required:
        - id
        - structureNumber
        - source
        - status
        - teamMembers
        - defectCount
        - cs4Count
        - syncedAt
        - defects
        - nbiRatings

    UpsertSessionBody:
      type: object
      properties:
        structureNumber:
          type: string
        source:
          $ref: "#/components/schemas/SessionSource"
        status:
          $ref: "#/components/schemas/SessionStatus"
        finalizedAt:
          type: string
          format: date-time
          nullable: true
        teamLeader:
          type: ["string", "null"]
        teamMembers:
          type: array
          items:
            type: string
        inspectionDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        weather:
          type: ["string", "null"]
        equipmentUsed:
          type: ["string", "null"]
        defects:
          type: array
          items: {}
        nbiRatings:
          type: array
          items: {}
        importSummary: {}
        pdfAnnotations:
          type: array
          items: {}
      required:
        - structureNumber

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
